[tool.ruff]
target-version = "py313"
line-length = 100
src = ["accounts", "core", "notes", "ridgenote", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ridgenote.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=accounts --cov=core --cov=notes --cov=ridgenote --cov-report=term-missing"
