{% extends "accounts/base.html" %}

{% block content %}
  <h1>Reset Password for {{ target.display_label }}</h1>
  <p>Username: {{ target.username }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      {% include "accounts/_form_field.html" %}
    {% endfor %}
    <button type="submit">Reset Password</button>
  </form>
{% endblock %}
